# The blueprint the runtime serves for the integration suite.
#
# Adapted from the runtime's own ipc-http-api fixture, so the handler tags it
# declares are the ones the runtime builds from these annotations, and the SDK's
# handshake either matches them exactly or fails at startup.
#
# The runtime identifier is os-only.debian13 for accurate demonstration purposes. The
# runtime does not read spec.runtime at all, it is the CLI's blueprint transform
# that does, so this suite cannot tell a correct value from a wrong one and the
# choice has to be checked there.
version: 2025-11-02
transform: celerity-2026-02-28

resources:
  ordersApi:
    type: "celerity/api"
    description: "An HTTP API with no auth, so IPC dispatch is exercised on its own."
    metadata:
      displayName: Orders API
    linkSelector:
      byLabel:
        application: "orders"
    spec:
      protocols: ["http", "websocket"]
      # A hybrid API has to say where each protocol is served, and base paths
      # live under a domain. The domain name and certificate are required by the
      # schema and unused when serving locally.
      domain:
        domainName: "tests.celerity.local"
        certificateId: "local-tests"
        basePaths:
          - protocol: "http"
            basePath: "/"
          - protocol: "websocket"
            basePath: "/ws"
      tracingEnabled: false

  getOrderHandler:
    type: "celerity/handler"
    metadata:
      displayName: Get Order Handler
      labels:
        application: "orders"
      annotations:
        celerity.handler.http: true
        celerity.handler.http.method: "GET"
        celerity.handler.http.path: "/orders/{orderId}"
    spec:
      handlerName: Orders-GetOrderHandler-v1
      codeLocation: "./handlers"
      handler: "getOrder"
      runtime: "os-only.debian13"
      memory: 1024
      timeout: 10
      tracingEnabled: false

  createOrderHandler:
    type: "celerity/handler"
    metadata:
      displayName: Create Order Handler
      labels:
        application: "orders"
      annotations:
        celerity.handler.http: true
        celerity.handler.http.method: "POST"
        celerity.handler.http.path: "/orders"
    spec:
      handlerName: Orders-CreateOrderHandler-v1
      codeLocation: "./handlers"
      handler: "createOrder"
      runtime: "os-only.debian13"
      memory: 1024
      timeout: 10
      tracingEnabled: false

  # A catch-all route, so segment splitting is exercised end to end: the
  # blueprint's {filePath+} reaches a handler as the router's {*filePath}.
  getFileHandler:
    type: "celerity/handler"
    metadata:
      displayName: Get File Handler
      labels:
        application: "orders"
      annotations:
        celerity.handler.http: true
        celerity.handler.http.method: "GET"
        celerity.handler.http.path: "/files/{filePath+}"
    spec:
      handlerName: Orders-GetFileHandler-v1
      codeLocation: "./handlers"
      handler: "getFile"
      runtime: "os-only.debian13"
      memory: 1024
      timeout: 10
      tracingEnabled: false

  # WebSocket handlers. The API states no routeKey, so it resolves to the
  # runtime's default and the tags are {default key}::{route}. The SDK
  # reconciles against whatever the runtime declares, so this fixture would
  # still work with a routeKey set here.
  getReceiptHandler:
    type: "celerity/handler"
    metadata:
      displayName: Get Receipt Handler
      labels:
        application: "orders"
      annotations:
        celerity.handler.http: true
        celerity.handler.http.method: "GET"
        celerity.handler.http.path: "/orders/{orderId}/receipt"
    spec:
      handlerName: Orders-GetReceiptHandler-v1
      codeLocation: "./handlers"
      handler: "getReceipt"
      runtime: "os-only.debian13"
      memory: 1024
      timeout: 10
      tracingEnabled: false

  # Routed entirely by the blueprint: the code registers this by name with
  # celerity.Handler and states no method or path.
  archiveOrderHandler:
    type: "celerity/handler"
    metadata:
      displayName: Archive Order Handler
      labels:
        application: "orders"
      annotations:
        celerity.handler.http: true
        celerity.handler.http.method: "POST"
        celerity.handler.http.path: "/orders/{orderId}/archive"
    spec:
      handlerName: Orders-ArchiveOrderHandler-v1
      codeLocation: "./handlers"
      handler: "archiveOrder"
      runtime: "os-only.debian13"
      memory: 1024
      timeout: 10
      tracingEnabled: false

  wsConnectHandler:
    type: "celerity/handler"
    metadata:
      displayName: WS Connect Handler
      labels:
        application: "orders"
      annotations:
        celerity.handler.websocket: true
        celerity.handler.websocket.route: "$connect"
    spec:
      handlerName: Orders-WSConnectHandler-v1
      codeLocation: "./handlers"
      handler: "wsConnect"
      runtime: "os-only.debian13"
      memory: 1024
      timeout: 10
      tracingEnabled: false

  wsSendMessageHandler:
    type: "celerity/handler"
    metadata:
      displayName: WS Send Message Handler
      labels:
        application: "orders"
      annotations:
        celerity.handler.websocket: true
        celerity.handler.websocket.route: "sendMessage"
    spec:
      handlerName: Orders-WSSendMessageHandler-v1
      codeLocation: "./handlers"
      handler: "wsSendMessage"
      runtime: "os-only.debian13"
      memory: 1024
      timeout: 10
      tracingEnabled: false

  wsDisconnectHandler:
    type: "celerity/handler"
    metadata:
      displayName: WS Disconnect Handler
      labels:
        application: "orders"
      annotations:
        celerity.handler.websocket: true
        celerity.handler.websocket.route: "$disconnect"
    spec:
      handlerName: Orders-WSDisconnectHandler-v1
      codeLocation: "./handlers"
      handler: "wsDisconnect"
      runtime: "os-only.debian13"
      memory: 1024
      timeout: 10
      tracingEnabled: false

  # A custom handler, which is what a handler resource carrying no protocol
  # annotation is, nothing triggers it, and it is reached by name through the
  # runtime's local invoke endpoint or from another handler. Its tag is built
  # from the resource name, so the code registers it under that rather than
  # under spec.handlerName.
  recalculatePricingHandler:
    type: "celerity/handler"
    metadata:
      displayName: Recalculate Pricing Handler
      labels:
        application: "orders"
    spec:
      handlerName: Orders-RecalculatePricingHandler-v1
      codeLocation: "./handlers"
      handler: "recalculatePricing"
      runtime: "os-only.debian13"
      memory: 1024
      timeout: 10
      tracingEnabled: false

  # A queue consumer. The source id is what the handler tag is keyed by, so the
  # code registers against "ordersQueue" and the runtime builds
  # source::ordersQueue::processOrdersHandler from this and the handler's
  # resource name.
  #
  # Served locally by Redis streams, the runtime reads celerity:queue:ordersQueue,
  # which is what the suite publishes to.
  ordersConsumer:
    type: "celerity/consumer"
    metadata:
      displayName: Orders Consumer
    linkSelector:
      byLabel:
        consumer: "orders"
    spec:
      sourceId: "ordersQueue"
      batchSize: 10
      visibilityTimeout: 30
      waitTimeSeconds: 1
      partialFailures: true

  processOrdersHandler:
    type: "celerity/handler"
    metadata:
      displayName: Process Orders Handler
      labels:
        consumer: "orders"
      annotations:
        celerity.handler.consumer: true
    spec:
      handlerName: Orders-ProcessOrdersHandler-v1
      codeLocation: "./handlers"
      handler: "processOrders"
      runtime: "os-only.debian13"
      memory: 1024
      timeout: 10
      tracingEnabled: false

  # A schedule. Locally the runtime does not run a clock of its own, it reads
  # celerity:schedules:nightlyReport, so a trigger is something published to
  # that stream, which is what lets the suite fire it on demand.
  nightlyReport:
    type: "celerity/schedule"
    metadata:
      displayName: Nightly Report
    linkSelector:
      byLabel:
        schedule: "nightly"
    spec:
      schedule: "cron(0 0 * * ? *)"

  buildReportHandler:
    type: "celerity/handler"
    metadata:
      displayName: Build Report Handler
      labels:
        schedule: "nightly"
      annotations:
        celerity.handler.schedule: true
    spec:
      handlerName: Orders-BuildReportHandler-v1
      codeLocation: "./handlers"
      handler: "buildReport"
      runtime: "os-only.debian13"
      memory: 1024
      timeout: 10
      tracingEnabled: false

  # Reports what the consumer and schedule handlers have seen, so the suite can
  # assert on work that produces no response of its own.
  processedHandler:
    type: "celerity/handler"
    metadata:
      displayName: Processed Handler
      labels:
        application: "orders"
      annotations:
        celerity.handler.http: true
        celerity.handler.http.method: "GET"
        celerity.handler.http.path: "/processed"
    spec:
      handlerName: Orders-ProcessedHandler-v1
      codeLocation: "./handlers"
      handler: "processed"
      runtime: "os-only.debian13"
      memory: 1024
      timeout: 10
      tracingEnabled: false

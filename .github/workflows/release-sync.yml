name: Sync module versions on a release

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  # release-please bumps .release-please-manifest.json and leaves go.mod alone,
  # because a module's require of a sibling is an ordinary dependency as far as
  # it is concerned. Left that way the released modules require versions that
  # were never tagged, which is invisible here and breaks every consumer, so the
  # requirements are brought along in the same pull request and land in the same
  # commit as the manifest.
  sync:
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The branch itself rather than the merge commit a pull_request event
      # checks out by default, since this commits to it.
      #
      # RELEASE_PLEASE_TOKEN is preferred for the same reason the release
      # workflow prefers it. A push made with GITHUB_TOKEN starts no workflow,
      # so the commit this adds would carry no checks of its own, and a branch
      # protected on those would refuse the merge. With a token configured the
      # push is an ordinary one and the checks run.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Point each requirement at the version being released
        run: bash scripts/sync-module-versions.sh

      # release-please force-pushes this branch whenever it rewrites the
      # release, which discards this commit. The workflow runs again on that
      # push, so it is reapplied rather than lost.
      - name: Commit the requirements with the release
        run: |
          if git diff --quiet; then
            echo "every requirement already named the version being released"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: point module requirements at the release version"
          git push

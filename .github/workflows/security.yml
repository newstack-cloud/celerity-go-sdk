name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  # The only place govulncheck runs. CI covers push and pull requests, and this
  # workflow covers those plus a schedule, which is the trigger that matters, an
  # advisory can be published against code nobody has touched, and a scan that
  # only runs on a change would not find it until someone made one.
  vulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          # Without check-latest, setup-go prefers a toolchain already cached
          # on the runner, so "1.26" matched the image's go1.26.5 and never
          # fetched go1.26.6, leaving two patched standard library advisories
          # reported against every build.
          check-latest: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@709015412431dd2b5b28a53c06c70bc02d49074c # v1.8.0
      - run: bash scripts/vulncheck.sh

  trivy:
    name: Repository scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: repository

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

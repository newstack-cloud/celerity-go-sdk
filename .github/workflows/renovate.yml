name: Renovate

# Self-hosted Renovate runner.
#
# Renovate owns version updates across the repository. Dependabot is kept for
# security updates only, which are enabled in the repository's settings rather
# than in a config file, so there is deliberately no .github/dependabot.yml
# here: that file configures version updates, which would duplicate Renovate.
#
# See docs/RENOVATE.md.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Renovate log level"
        required: false
        default: "info"
      dryRun:
        description: "Dry run (full|null)"
        required: false
        default: "null"

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      # Renovate wants a token of its own rather than GITHUB_TOKEN, which cannot
      # trigger CI on the pull requests it opens, leaving dependency bumps
      # unverified. Until that secret is set there is nothing to run, and this
      # is checked rather than left to fail: the schedule is hourly, so an
      # unconfigured repository would otherwise report a failure every hour.
      #
      # The secrets context is not available to a job-level `if`, so the check
      # is a step.
      - id: token
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -z "$RENOVATE_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "RENOVATE_TOKEN is not set, so Renovate has nothing to run with."
            echo "See docs/RENOVATE.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Renovate
        if: steps.token.outputs.configured == 'true'
        uses: renovatebot/github-action@v41.0.0
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          RENOVATE_DRY_RUN: ${{ inputs.dryRun || 'null' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}

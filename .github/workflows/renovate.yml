name: Renovate

# Self-hosted Renovate runner.
#
# Renovate owns version updates across the repository. Dependabot is kept for
# security updates only, which are enabled in the repository's settings rather
# than in a config file, so there is deliberately no .github/dependabot.yml
# here: that file configures version updates, which would duplicate Renovate.
#
# See docs/RENOVATE.md.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Renovate log level"
        required: false
        default: "info"
      dryRun:
        description: "Dry run (full|null)"
        required: false
        default: "null"

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@v41.0.0
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          RENOVATE_DRY_RUN: ${{ inputs.dryRun || 'null' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}

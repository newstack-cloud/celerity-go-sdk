name: Renovate

# Self-hosted Renovate runner.
#
# Renovate owns version updates across the repository. Dependabot is kept for
# security updates only, which are enabled in the repository's settings rather
# than in a config file, so there is deliberately no .github/dependabot.yml
# here: that file configures version updates, which would duplicate Renovate.
#
# See docs/RENOVATE.md.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Renovate log level"
        required: false
        default: "info"
      dryRun:
        description: "Dry run (full|null)"
        required: false
        default: "null"

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      # RENOVATE_TOKEN is an organisation secret. It is a token of its own
      # rather than GITHUB_TOKEN because a pull request opened with the latter
      # does not trigger CI, leaving a dependency bump unverified, which is the
      # one thing a dependency PR is for.
      #
      # If it ever goes missing this job fails, which is what should happen: a
      # scheduled job that quietly succeeds while doing nothing is a job you
      # stop noticing has stopped.
      - name: Run Renovate
        uses: renovatebot/github-action@9fea9f0fbf80401026d11d03911d62b1f70fef1f # v46.3.3
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          RENOVATE_DRY_RUN: ${{ inputs.dryRun || 'null' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
